<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e4decf" />
  <title>Gianna &amp; Nathan — Save the Date</title>

  <meta name="description" content="Gianna Grace and Nathan Robert — September 25, 2027 — Villa Siena, Gilbert, Arizona." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Gianna &amp; Nathan — Save the Date" />
  <meta property="og:description" content="September 25, 2027 · Villa Siena · Gilbert, Arizona" />
  <!-- Replace with the absolute URL once the domain is live, e.g. https://example.com/og.jpg -->
  <meta property="og:image" content="/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314110e'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' fill='%23efe9dd' text-anchor='middle'%3EGN%3C/text%3E%3C/svg%3E" />

  <link rel="preload" as="font" type="font/woff2" href="/caslon-display-400.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/caslon-text-400-italic.woff2" crossorigin />
  <link rel="stylesheet" href="/styles.css" />

  <noscript>
    <style>
      /* Without JavaScript the envelope can never be opened, so skip the
         sequence entirely rather than stranding the guest on a locked screen. */
      body.is-locked { overflow: auto; height: auto; }
      .opening { display: none; }
      .reveal { opacity: 1; transform: none; }
    </style>
  </noscript>
</head>

<body class="is-locked">

  <main>
    <!-- ─────────────  THE ENVELOPE  ───────────── -->
    <section class="opening" id="opening" aria-label="Save the date envelope">
      <p class="opening__date">September 25, 2027</p>

      <button class="envelope-trigger" id="openEnvelope" aria-label="Open Gianna and Nathan's save the date">
        <span class="envelope" aria-hidden="true">
          <span class="envelope__body"></span>

          <span class="envelope__card">
            <span class="envelope__card-mono"><span>G</span><i></i><span>N</span></span>
            <span class="envelope__card-label">Save the Date</span>
          </span>

          <span class="envelope__lining"></span>
          <span class="envelope__flap"></span>
          <span class="seal">
            <span class="seal__mono"><span>G</span><i></i><span>N</span></span>
          </span>
        </span>
      </button>

      <button type="button" class="opening__prompt" id="openingPrompt">
        <span>Open</span>
        <i></i>
      </button>

      <p class="opening__continue" id="openingContinue" aria-hidden="true">
        <span>Scroll</span>
        <i></i>
      </p>
    </section>

    <!-- ─────────────  THE PLATE  ───────────── -->
    <!-- One screen, landscape. Nothing here scrolls. -->
    <section class="plate" id="invitation">
      <div class="plate__fibre" aria-hidden="true"></div>
      <div class="plate__burnish" aria-hidden="true"></div>
      <div class="plate__rule" aria-hidden="true"></div>

      <article class="leaf reveal" aria-label="Gianna Grace and Nathan Robert save the date">

        <figure class="plate-figure">
          <img src="/villa-siena.webp" width="800" height="1200"
               decoding="async" fetchpriority="low"
               alt="Gianna and Nathan at the entrance to Villa Siena" />
        </figure>

        <div class="leaf__type">
          <div class="monogram" aria-label="G and N"><span>G</span><i></i><span>N</span></div>

          <p class="label">Save the Date</p>
          <p class="quiet">for the wedding of</p>

          <h1 class="names">
            Gianna Grace
            <em>and</em>
            Nathan Robert
          </h1>

          <div class="ornament" aria-hidden="true"><i></i><b></b><i></i></div>

          <p class="date">September 25, 2027</p>
          <p class="leaf__venue">Villa Siena &middot; Gilbert, Arizona</p>

          <p class="leaf__foot">Formal invitation and details to follow</p>
        </div>

      </article>
    </section>
  </main>

  <script src="/script.js"></script>
</body>
</html>
